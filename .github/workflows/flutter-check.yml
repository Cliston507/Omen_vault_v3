name: Flutter check

on:
  push:
    branches: [develop-v3, main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyze (compile errors fail the build)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev
          flutter test

      - name: Build web
        run: flutter build web --release
