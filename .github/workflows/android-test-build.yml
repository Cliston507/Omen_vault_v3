name: Android test build

# Builds an APK you can install straight onto an Android phone (Pixel 8 =
# arm64). The newest build always replaces the "test-build" release:
# github.com/Cliston507/Omen_vault_v3/releases/tag/test-build

on:
  push:
    branches: [develop-v3]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-test-build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build APK (arm64, for modern phones like Pixel 8)
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Publish as the "test-build" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          cp "$APK" omen-vault-test.apk
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build omen-vault-test.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Omen Vault test build (${GITHUB_SHA::7})" \
            --notes "Test build from develop-v3, commit ${GITHUB_SHA::7}. On your Android phone: tap omen-vault-test.apk below to download, then open it to install."
