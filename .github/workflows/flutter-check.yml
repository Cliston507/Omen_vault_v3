name: Flutter check

on:
  push:
    branches: [develop-v3, main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze (fails only on real errors)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test key recovery + encryption
        run: flutter test test/unit/omen_vault_key_recovery_service_test.dart test/unit/entry_cipher_test.dart
